<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Meysa</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:Arial,sans-serif;background:linear-gradient(135deg,#ffd6e7,#d9e7ff)}.card{width:min(90%,420px);padding:38px 25px;text-align:center;border-radius:28px;background:rgba(255,255,255,.92);box-shadow:0 15px 40px rgba(0,0,0,.15)}h1{margin:0 0 12px;font-size:38px;color:#e85d9e}h2{margin:8px 0 20px;font-size:30px;color:#555}p{font-size:18px;line-height:1.7;color:#555}.emoji{font-size:55px;margin-bottom:10px}button{border:0;border-radius:25px;padding:13px 24px;font-size:16px;background:#e85d9e;color:white}#message{display:none;margin-top:20px;font-weight:bold;color:#e85d9e}
</style>
</head>
<body>
<div class="card">
<div class="emoji">🎂🎉💖</div>
<h1>Happy Birthday!</h1>
<h2>Meysa</h2>
<p>Semoga hari spesial ini membawa banyak kebahagiaan, kesehatan, dan hal-hal indah untuk Meysa. ✨</p>
<button onclick="document.getElementById('message').style.display='block'">Klik di sini 🎁</button>
<div id="message">Selamat ulang tahun, Meysa! 🥳 Semoga semua harapan baikmu tercapai! 💐</div>
</div>
</body>
</html>
